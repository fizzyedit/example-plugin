# Builds the plugin on every push and pull request. `FIZZY_PROFILE` keeps the install inside the
# workspace (from fizzy SDK 0.2.19; before it, the runner's own config directory).
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FIZZY_PROFILE: ${{ github.workspace }}/.profile
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - run: zig build --summary all
